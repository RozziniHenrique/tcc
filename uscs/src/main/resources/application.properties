spring.application.name=stfer-api

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tccuscs?useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.baseline-on-migrate=true

# JACKSON
spring.jackson.time-zone=America/Sao_Paulo

# SERVER
spring.web.error.include-stacktrace=never
server.forward-headers-strategy=framework

# JWT - obrigatorio fora do perfil de teste
api.security.token.secret=${JWT_SECRET}
api.security.token.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
api.security.token.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Recuperacao de senha
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

# E-mail. Em desenvolvimento pode ficar false; o codigo sera enviado apenas ao log local.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@stfer.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Administrador inicial
# Ative somente na primeira inicializacao do ambiente.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.nome=${APP_BOOTSTRAP_ADMIN_NOME:}
app.bootstrap-admin.cpf=${APP_BOOTSTRAP_ADMIN_CPF:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.senha=${APP_BOOTSTRAP_ADMIN_SENHA:}
app.bootstrap-admin.telefone=${APP_BOOTSTRAP_ADMIN_TELEFONE:}
app.bootstrap-admin.endereco=${APP_BOOTSTRAP_ADMIN_ENDERECO:}