spring.application.name=uscs

# DATABASE
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/tccuscs?useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# FLYWAY
spring.flyway.baseline-on-migrate=true

# JACKSON
spring.jackson.time-zone=America/Sao_Paulo

# SERVER
spring.web.error.include-stacktrace=never

#JWT
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-ultra-forte-123}