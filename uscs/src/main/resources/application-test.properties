spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-only
spring.jpa.show-sql=false

spring.flyway.enabled=false
api.security.token.secret=test-secret-key-with-at-least-32-characters
api.security.token.access-expiration-seconds=900
api.security.token.refresh-expiration-days=30
app.mail.enabled=false
